<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Impostor - Multijugador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4 font-sans select-none">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-3xl font-extrabold text-center text-amber-400 mb-2 tracking-wide">🕵️ EL IMPOSTOR</h1>
    <p class="text-center text-slate-400 text-sm mb-6">Juego multijugador en tiempo real</p>

    <!-- MENSAJE DE ESTADO / ERROR -->
    <div id="statusMessage" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium"></div>

    <!-- PANTALLA 1: INICIO -->
    <div id="screen-home" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Tu Nombre</label>
        <input id="playerName" type="text" placeholder="Ej: Felipe" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400">
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <button id="btnCreate" onclick="createRoom()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg transition active:scale-95 shadow-md">
          Crear Sala
        </button>
        <button onclick="showJoinScreen()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg transition active:scale-95">
          Unirse
        </button>
      </div>
    </div>

    <!-- PANTALLA 2: UNIRSE A SALA -->
    <div id="screen-join" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Código de Sala (4 dígitos)</label>
        <input id="roomCodeInput" type="number" placeholder="Ej: 4821" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-center text-2xl font-mono tracking-widest text-white focus:outline-none focus:border-amber-400">
      </div>
      <button id="btnJoin" onclick="joinRoom()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-lg transition active:scale-95 shadow-md">
        Entrar a la Sala
      </button>
      <button onclick="showHomeScreen()" class="w-full text-slate-400 text-sm py-2 hover:underline">
        ← Volver
      </button>
    </div>

    <!-- PANTALLA 3: SALA DE ESPERA (LOBBY) -->
    <div id="screen-lobby" class="space-y-5 hidden">
      <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700 text-center">
        <p class="text-xs text-slate-400 uppercase font-semibold mb-1">Comparte este Código</p>
        <div id="displayRoomCode" class="text-4xl font-black font-mono tracking-widest text-amber-400">----</div>
      </div>

      <div>
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Jugadores conectados (<span id="playerCount">1</span>)</h3>
        <ul id="playersList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></ul>
      </div>

      <div id="hostControls" class="hidden">
        <button onclick="startGame()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg transition active:scale-95 shadow-md">
          ¡Iniciar Partida!
        </button>
      </div>
      <div id="guestWaiting" class="text-center text-sm text-amber-400/80 animate-pulse font-medium">
        Esperando que el anfitrión inicie...
      </div>
    </div>

    <!-- PANTALLA 4: ROL ASIGNADO -->
    <div id="screen-role" class="space-y-5 hidden text-center">
      <div class="py-4">
        <p class="text-sm uppercase tracking-widest text-slate-400 font-bold mb-2">Tu Rol Secreto</p>
        
        <div id="roleBox" class="p-6 rounded-2xl border-2 transition-all">
          <div id="roleTitle" class="text-3xl font-black mb-2"></div>
          <div id="roleDescription" class="text-slate-300 text-sm"></div>
        </div>
      </div>

      <p class="text-xs text-slate-400">No dejes que los demás miren tu pantalla.</p>

      <div id="hostReset" class="hidden pt-4">
        <button onclick="resetGame()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg transition active:scale-95">
          Nueva Ronda
        </button>
      </div>
    </div>

  </div>

  <script>
    const WORDS = [
      "Playa", "Hospital", "Avión", "Cine", "Restaurante", "Escuela",
      "Gimnasio", "Supermercado", "Biblioteca", "Estadio", "Circo",
      "Banco", "Hotel", "Museo", "Zoológico", "Crucero", "Submarino", "Estación Espacial"
    ];

    // Identificador persistente por cliente
    let clientUUID = localStorage.getItem('impostor_client_id');
    if (!clientUUID) {
      clientUUID = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('impostor_client_id', clientUUID);
    }

    let peer = null;
    let myName = "";
    let isHost = false;
    let roomCode = "";
    let connections = new Map(); // uuid -> conn
    let hostConn = null;
    let players = [];            // [{ uuid, name }]
    let heartbeatInterval = null;

    function notify(text, isError = false) {
      const msg = document.getElementById('statusMessage');
      msg.innerText = text;
      msg.className = isError 
        ? "mb-4 p-3 rounded-lg text-sm text-center font-medium bg-red-950/60 border border-red-500/50 text-red-300"
        : "mb-4 p-3 rounded-lg text-sm text-center font-medium bg-amber-950/60 border border-amber-500/50 text-amber-300";
      msg.classList.remove('hidden');
    }

    function clearNotify() {
      document.getElementById('statusMessage').classList.add('hidden');
    }

    function showHomeScreen() {
      clearNotify();
      document.getElementById('screen-home').classList.remove('hidden');
      document.getElementById('screen-join').classList.add('hidden');
      document.getElementById('screen-lobby').classList.add('hidden');
      document.getElementById('screen-role').classList.add('hidden');
    }

    function showJoinScreen() {
      const name = document.getElementById('playerName').value.trim();
      if (!name) return alert("Por favor ingresa tu nombre");
      myName = name;
      clearNotify();
      document.getElementById('screen-home').classList.add('hidden');
      document.getElementById('screen-join').classList.remove('hidden');
    }

    // CREAR SALA (HOST)
    function createRoom() {
      const name = document.getElementById('playerName').value.trim();
      if (!name) return alert("Por favor ingresa tu nombre");
      myName = name;
      isHost = true;

      const btn = document.getElementById('btnCreate');
      btn.disabled = true;
      btn.innerText = "Conectando...";
      notify("Conectando con el servidor...");

      roomCode = Math.floor(1000 + Math.random() * 9000).toString();
      const peerId = 'impostor-game-' + roomCode;

      if (peer) peer.destroy();

      peer = new Peer(peerId, {
        debug: 1,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('open', () => {
        clearNotify();
        btn.disabled = false;
        btn.innerText = "Crear Sala";
        players = [{ uuid: clientUUID, name: myName }];
        document.getElementById('screen-home').classList.add('hidden');
        document.getElementById('screen-lobby').classList.remove('hidden');
        document.getElementById('displayRoomCode').innerText = roomCode;
        document.getElementById('hostControls').classList.remove('hidden');
        document.getElementById('guestWaiting').classList.add('hidden');
        renderPlayers();
        startHeartbeat();
      });

      peer.on('connection', (conn) => {
        let senderUUID = null;

        conn.on('data', (data) => {
          if (data.type === 'JOIN') {
            senderUUID = data.uuid;
            
            // Cerrar conexión anterior si existía para ese mismo usuario
            if (connections.has(senderUUID)) {
              try { connections.get(senderUUID).close(); } catch (e) {}
            }
            connections.set(senderUUID, conn);

            // Evitar duplicados por UUID
            const existingIndex = players.findIndex(p => p.uuid === senderUUID);
            if (existingIndex !== -1) {
              players[existingIndex].name = data.name; // Actualiza nombre si cambió
            } else {
              players.push({ uuid: senderUUID, name: data.name });
            }

            renderPlayers();
            broadcastLobby();
          }
        });

        const handleDisconnect = () => {
          if (senderUUID && connections.get(senderUUID) === conn) {
            connections.delete(senderUUID);
            players = players.filter(p => p.uuid !== senderUUID);
            renderPlayers();
            broadcastLobby();
          }
        };

        conn.on('close', handleDisconnect);
        conn.on('error', handleDisconnect);
      });

      peer.on('error', (err) => {
        btn.disabled = false;
        btn.innerText = "Crear Sala";
        if (err.type === 'unavailable-id') {
          createRoom();
        } else {
          notify("Error al conectar: " + err.type, true);
        }
      });
    }

    // Ping para limpiar conexiones muertas silenciosas en móviles
    function startHeartbeat() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(() => {
        let changed = false;
        connections.forEach((conn, uuid) => {
          if (!conn.open) {
            connections.delete(uuid);
            players = players.filter(p => p.uuid !== uuid);
            changed = true;
          }
        });
        if (changed) {
          renderPlayers();
          broadcastLobby();
        }
      }, 3000);
    }

    // UNIRSE A SALA (GUEST)
    function joinRoom() {
      const code = document.getElementById('roomCodeInput').value.trim();
      if (code.length !== 4) return alert("Ingresa un código de 4 dígitos");
      roomCode = code;

      const btn = document.getElementById('btnJoin');
      btn.disabled = true;
      btn.innerText = "Buscando sala...";
      notify("Buscando sala " + roomCode + "...");

      if (peer) peer.destroy();

      peer = new Peer(null, {
        debug: 1,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('open', () => {
        hostConn = peer.connect('impostor-game-' + roomCode, { reliable: true });

        hostConn.on('open', () => {
          clearNotify();
          btn.disabled = false;
          btn.innerText = "Entrar a la Sala";
          hostConn.send({ type: 'JOIN', uuid: clientUUID, name: myName });
          document.getElementById('screen-join').classList.add('hidden');
          document.getElementById('screen-lobby').classList.remove('hidden');
          document.getElementById('displayRoomCode').innerText = roomCode;
        });

        hostConn.on('data', (data) => {
          if (data.type === 'UPDATE_PLAYERS') {
            players = data.players;
            renderPlayers();
          } else if (data.type === 'START_GAME') {
            showRole(data.isImpostor, data.word);
          } else if (data.type === 'RESET') {
            document.getElementById('screen-role').classList.add('hidden');
            document.getElementById('screen-lobby').classList.remove('hidden');
          }
        });

        const onHostDisconnect = () => {
          notify("Se perdió la conexión con el anfitrión.", true);
          setTimeout(() => showHomeScreen(), 2000);
        };

        hostConn.on('close', onHostDisconnect);
        hostConn.on('error', onHostDisconnect);
      });

      peer.on('error', (err) => {
        btn.disabled = false;
        btn.innerText = "Entrar a la Sala";
        notify("Error al entrar a la sala: " + err.type, true);
      });
    }

    function renderPlayers() {
      const list = document.getElementById('playersList');
      list.innerHTML = "";
      players.forEach(p => {
        const li = document.createElement('li');
        li.className = "flex items-center justify-between bg-slate-700/60 px-3 py-2 rounded-lg text-sm";
        const isLeader = p.uuid === players[0]?.uuid;
        li.innerHTML = `<span>${p.name}</span>` + (isLeader ? `<span class="text-[10px] bg-amber-400 text-slate-950 px-2 py-0.5 rounded font-bold uppercase">Líder</span>` : "");
        list.appendChild(li);
      });
      document.getElementById('playerCount').innerText = players.length;
    }

    function broadcastLobby() {
      connections.forEach((conn) => {
        if (conn.open) conn.send({ type: 'UPDATE_PLAYERS', players });
      });
    }

    function startGame() {
      if (players.length < 3) {
        if (!confirm("Hay menos de 3 jugadores. ¿Quieres iniciar de todas formas para probar?")) return;
      }

      const secretWord = WORDS[Math.floor(Math.random() * WORDS.length)];
      const impostorIndex = Math.floor(Math.random() * players.length);

      players.forEach((p, index) => {
        const isImpostor = (index === impostorIndex);
        if (p.uuid === clientUUID) {
          showRole(isImpostor, secretWord);
        } else {
          const conn = connections.get(p.uuid);
          if (conn && conn.open) {
            conn.send({ type: 'START_GAME', isImpostor, word: secretWord });
          }
        }
      });
    }

    function showRole(isImpostor, word) {
      document.getElementById('screen-lobby').classList.add('hidden');
      document.getElementById('screen-role').classList.remove('hidden');

      const box = document.getElementById('roleBox');
      const title = document.getElementById('roleTitle');
      const desc = document.getElementById('roleDescription');

      if (isImpostor) {
        box.className = "p-6 rounded-2xl border-2 border-red-500 bg-red-950/40 text-red-400";
        title.innerText = "¡ERES EL IMPOSTOR!";
        desc.innerText = "No conoces la palabra. Escucha las descripciones de los demás y disimula.";
      } else {
        box.className = "p-6 rounded-2xl border-2 border-emerald-500 bg-emerald-950/40 text-emerald-400";
        title.innerText = word;
        desc.innerText = "Esta es la palabra secreta. Da pistas sutiles para descubrir quién finge.";
      }

      if (isHost) {
        document.getElementById('hostReset').classList.remove('hidden');
      }
    }

    function resetGame() {
      connections.forEach((conn) => {
        if (conn.open) conn.send({ type: 'RESET' });
      });
      document.getElementById('screen-role').classList.add('hidden');
      document.getElementById('screen-lobby').classList.remove('hidden');
    }
  </script>
</body>
</html>
